# PostgreSQL local para desarrollo:  docker compose up -d
services:
  db:
    image: postgres:16
    container_name: sistep-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sistep
    ports:
      - "5433:5432"
    volumes:
      - sistep_pg:/var/lib/postgresql/data
volumes:
  sistep_pg:
